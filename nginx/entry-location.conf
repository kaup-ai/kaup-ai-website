# =============================================================================
# Kaup 官网入口 —— 转发体（server 上下文；由 entry.conf.template include）
# 渲染：envsubst 白名单（同骨架模板）。
# =============================================================================

# ── 入口连通性探针（不经 web）────────────────────────────────────────────────
# 供 LB / 外部探活使用：只证明入口自身可用，不消耗应用侧限流计数、不触发 SSR。
# ⚠️ 该路径由入口占用；若将来应用需要同名路由，改这里或换路径。
location = /entry-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# ── 带内容指纹的构建产物：一年 immutable ─────────────────────────────────────
# 缓存头由入口强制给出，不依赖上游是否带、带得对不对。
# ⚠️ nginx 的 add_header 不继承：本 location 内一旦有 add_header，父级（server）的
#    安全头列表整体失效 ⇒ 必须重复 include 同一份片段（同一文件，不是复制粘贴）。
#    不加 always：404/502 不带长缓存头，避免错误响应被 CDN 长期缓存。
location /_nuxt/ {
    include /etc/nginx/fragments/entry-security-headers.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_set_header Host $host;
    proxy_pass http://$entry_upstream;
}

# ── 全站转发 ────────────────────────────────────────────────────────────────
location / {
    # 限流应用（开关：该变量为空即关闭；资产路径不在本 location，故不受限流）
    $ENTRY_LIMIT_REQ

    # ── 显式超时 ────────────────────────────────────────────────────────────
    # 官网是短请求（页面 SSR + /api/contact 转发到飞书）；30s 远大于正常耗时，
    # 仅用于兜住上游挂死。若将来加入长轮询/SSE，需按"入口 > 中间层 > 服务端"单调递增重设。
    proxy_connect_timeout $ENTRY_CONNECT_TIMEOUT;
    proxy_send_timeout    $ENTRY_SEND_TIMEOUT;
    proxy_read_timeout    $ENTRY_READ_TIMEOUT;

    # 转发语义：buffering on（默认，显式声明）+ HTTP/1.1 keepalive。
    proxy_buffering on;
    proxy_http_version 1.1;
    # 本站不使用 WebSocket（Nuxt dev 的 HMR WS 只走宿主 pnpm dev，不在此路径）：
    # 清 Connection 头即彻底关闭 WS 升级。启用需同时透传 Upgrade/Connection 并重估超时。
    proxy_set_header Connection "";

    proxy_pass http://$entry_upstream;

    # ── 转发头 ──────────────────────────────────────────────────────────────
    # X-Real-IP 由入口覆盖写（客户端伪造无效），应用侧 /api/contact 优先取它做限流键；
    # X-Forwarded-For 追加真实来源，末段即客户端地址（应用侧的第二取法）。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $entry_request_id;
}
