# =============================================================================
# Kaup 官网入口 —— 安全响应头（无变量，直接挂载，不需 envsubst 渲染）
# 被 include 两次：骨架模板的 server 块 与 entry-location.conf 的 /_nuxt/ location。
# 理由：nginx 的 add_header 不继承——location 内一旦出现 add_header，父级列表整体失效，
# 故 /_nuxt/ 必须重复声明；共用同一份文件而非复制，避免两处漂移。
#
# HSTS 不含 preload（preload 不可逆，需专门评估）；本站 80 全量 301 到 HTTPS，
# 故 includeSubDomains 与站点语义一致。
# 未加 CSP：Nuxt 运行时含内联脚本/样式，强 CSP 会直接打断水合；如需上 CSP，
# 应先引入 nonce/hash 方案（登记为后续项，不在本次交付内）。
# =============================================================================
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
