# =============================================================================
# Kaup 官网入口 —— 路由表（map 块，http 上下文；由 entry.conf.template include）
# 渲染：envsubst 白名单（同骨架模板），故上游变量被替换成实际地址。
#
# 官网是单上游站点（整站由 Nuxt/Nitro 承担），故此处只有 default 一条。
# 保留 map 分层是为与 kaup-core 同构：将来若拆分入口前缀（如 /api 落到独立服务、
# 静态资产直出对象存储），只改本表，不动骨架模板与转发体。
# =============================================================================
map $uri $entry_upstream {
    default $ENTRY_UPSTREAM_WEB;
}
