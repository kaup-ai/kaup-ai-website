mission:
  eyebrow: 使命
  title: 消解企业的人力边界
  lede: 当 5 人团队配备覆盖全链路的 AI Agent 矩阵，其市场触达、客户服务与业务吞吐，足以比肩 50 人团队——且在敏捷性与响应速度上更胜一筹。对资源有限的中小外贸企业而言，这意味着以更轻的人力规模，获取远超以往的获客与经营能力。
  closing: 智御无疆 — 以 AI 编排之力，守御企业每一条业务链路，赋能每一家企业超越自身边界。
