# 关于我们页文案（结构见 content.config.ts · about 集合）
seo:
  title: 关于我们 — 智御无疆 Kaup
  description: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能。智御无疆：赋能企业的 AI 全链路编排与智能调度平台。智 = AI 驱动的行业智能决策，御 = 守御企业运转全链路，无 = 开放架构承载无限场景，疆 = 重塑企业能力版图。
  ogDescription: 智御无疆：赋能企业的 AI 全链路编排与智能调度平台。智 = AI 驱动的行业智能决策，御 = 守御企业运转全链路，无 = 开放架构承载无限场景，疆 = 重塑企业能力版图。立足大连，服务全国外贸企业。
head:
  eyebrow: 关于我们
  title: 智以为御，无疆为境
  claim: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能
  lede: 智御无疆是赋能企业的 AI 全链路编排与智能调度平台。我们的核心理念是：外贸获客的方法论可以被工程化——通过将业务员从重复劳动中解放，使其回归真正创造价值的判断与客户关系经营。
chars:
  eyebrow: 品牌诠释
  title: 智 · 御 · 无 · 疆
  cards:
    - glyph: 智
      title: 以 AI 深度驱动行业智能决策
      paras:
        - AI Agent 正重构企业效率的底层逻辑：业务流转自动化、商业文档智能化、数据分析实时化、商机识别前置化。然而，模型能力并非价值的终点——对行业本质的深刻理解才是。
        - 智，在于让 AI「会做」更「懂做」。精准把握自动化推进与人机协同的决策边界，智，是沉淀于行业深处的认知资产。
    - glyph: 御
      title: 以编排中枢守御企业运转全链路
      paras:
        - 单点 Agent 解决环节级问题，企业级效率仰赖全链路协同。从获客到转化，从运营到增长，从执行到战略——御，是令多 Agent 体系如精密组织般高效协作。
        - 我们所构建的 AI OS，是面向企业级场景的业务编排中枢：从「人驱动流程」演进至「AI 驱动流程，人驱动决策」。御，既是调度，亦是守护。
    - glyph: 无
      title: 以开放架构承载无限场景
      paras:
        - 始于垂直行业实战打磨的 AI OS，底座自始即为开放架构：API / SDK 深度集成、插件系统灵活扩展、Workflow Builder 可视化编排、Agent Marketplace 生态市场。
        - 无，即不设限。不绑定特定模型，不锁定特定行业，不拘泥特定架构。
    - glyph: 疆
      title: 以 AI 之力重塑企业能力版图
      paras:
        - 企业皆有其无形之界——由组织规模、资源禀赋与经验壁垒共同划定。大型企业凭组织力量越界，中小企业往往止步于界内。
        - 我们的使命，在于消解这道边界。非「替代」之谓，实「赋能」之旨。
