# 平台能力页文案（结构见 content.config.ts · capabilities 集合）
seo:
  title: 平台能力 — 智御无疆 Kaup
  description: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能。智御无疆面向外贸场景的 12 项能力图谱：智能拓客、ICP 动态三维评分、开发信自动化、多渠道触达、Agent 自主决策与 HITL 安全、CRM/ERP 对接、知识库问答、本地部署与私有化。
  ogDescription: 面向外贸场景的 12 项能力图谱：智能拓客、ICP 动态三维评分、开发信自动化、多渠道触达、Agent 自主决策与 HITL 安全、CRM/ERP 对接、知识库问答、本地部署与私有化。
head:
  eyebrow: 能力图谱
  title: 12 项能力，覆盖外贸获客全链路
  claim: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能
  lede: 以下能力均可独立定制、组合或扩展。每一项能力都是相对独立的模块，通过清晰定义的接口相互连接——这是「可定制」的物理基础。
arch:
  eyebrow: 架构总览
  title: 混合部署，模块化解耦
  lede: 客户侧运行桌面端与 Agent 运行时，平台侧提供核心服务。架构的核心设计原则有五：模块化架构、Agent 插件机制、工作流可编排、客户自备模型与混合部署本地化。
  body: 关键并非组件本身，而在于模块解耦：企业可依据自身业务流程，对能力模块进行组合、裁剪与扩展。平台侧服务亦可下沉至企业本地，支撑私有化交付。
  rows:
    - head: Agent 运行时（开源）
      cells:
        - Agent 决策、多渠道通信、定时巡检、人机确认；成熟开源、支持自托管，行为可观测、可调整。
    - head: 工作流编排（状态图）
      cells:
        - 将外贸获客链路编排为可执行流程，节点可重组，适配不同行业的获客逻辑。
    - head: 混合部署
      cells:
        - 客户侧与平台侧分离，平台侧服务可下沉至企业本地，支撑私有化。
    - head: 多层安全纵深
      cells:
        - 输入校验 / 上下文隔离 / HITL / 审计；敏感操作强制人工确认，杜绝盲目执行。
    - head: 客户自备模型密钥
      cells:
        - 企业自带大模型密钥，模型可选可换，成本与合规由企业自主掌控。
groups:
  - id: acquisition
    eyebrow: 01 · 获客与触达
    title: 从客户发现到多渠道触达
    lede: 把业务员从海量低效的初筛与重复触达中释放出来，使其聚焦高价值客户。
    grid: 2
    cards:
      - idx: 能力 01
        title: 智能拓客
        body: 基于工作流编排的客户发现能力。依据企业设定的品类与目标市场，自主完成潜在客户检索、去重与结构化，输出涵盖公司、联系人、信用等维度的客户清单，供业务员评估与触达。相较人工逐条检索，同等时间内可覆盖更广的市场范围，降低单位获客的人力投入。
      - idx: 能力 02
        title: ICP 动态三维评分
        body: 从匹配度（Fit）、互动度（Engagement）、采购意向（Intent）三个维度，对潜在客户进行动态评分与分级。互动度基于邮件打开、回复等真实行为持续更新；采购意向综合多类采购信号评估其当下的购买意图。三者共同构成对客户优先级的量化判断。
      - idx: 能力 03
        title: 开发信自动化
        body: 依据预设序列自动发送开发信，内置送达率保障机制（域名预热、邮箱有效性验证、退信监控）与内容人性化引擎，规避批量群发常见的「模板指纹」风险。发送前对邮件质量分级校验，低质量邮件予以拦截或要求人工修订。
      - idx: 能力 04
        title: 多渠道触达
        body: 在开发信之外，支持即时通讯等渠道的客户触达与回复接入，实现多渠道沟通的统一管理。客户在不同渠道的互动行为汇入统一的互动度评分，形成完整的客户互动视图。
  - id: agent
    eyebrow: 02 · Agent 智能与安全
    title: 自主推进，但边界始终在企业手中
    lede: Agent 不是被动等待指令，而是依据业务规则主动推进；人工只在关键节点介入确认。
    grid: 2
    cards:
      - idx: 能力 05
        title: Agent 自主决策
        body: 具备多层业务上下文（企业身份、客户画像、工作流规则、安全规则等）与定时巡检机制，能够 7×24 自主执行既定任务——增量拓客、新客户识别与异常预警，并通过会话记忆保持上下文连续。
      - idx: 能力 06
        title: HITL 安全
        body: 采用多层防御纵深，对邮件发送、批量操作、数据删除等敏感动作强制执行人机确认（Human-in-the-Loop），Agent 不得自主完成。全部操作留存审计记录；异常或风险情形下采取「失败即封闭」策略。
  - id: crm
    eyebrow: 03 · 客户与业务管理
    title: 从被动响应，转向主动经营
    lede: 可与客户现有系统对接，避免人工重复录入带来的数据割裂与滞后。
    grid: 3
    cards:
      - idx: 能力 07
        title: CRM / ERP 对接
        body: 可与企业现有的客户管理、订单、库存等系统打通，实现客户与业务数据在系统间的流转。对接方案依据企业既有系统定制。
      - idx: 能力 08
        title: 客户全生命周期管理
        body: 基于客户采购周期与历史行为，主动执行复购提醒、流失预警（识别「应下单而未下单」的客户）与智能跟进，减少因跟进遗漏造成的客户流失。
      - idx: 能力 09
        title: 跟单操作
        body: 覆盖订单确认后的全流程节点跟踪——生产与备货、质检、发货、物流及交付，并对关键节点的异常进行预警，使跟单过程可视化、可追溯。
  - id: knowledge
    eyebrow: 04 · 知识与经验沉淀
    title: 把个人经验，沉淀为组织能力
    lede: 避免优秀经验随人员流动而流失，并支撑新业务员的快速成长。
    grid: 2
    cards:
      - idx: 能力 10
        title: 知识库问答
        body: 提供报价、标书、合同等场景的问答助手，并支持产品、销售、行业三类增强知识库，将企业分散的文档与经验转化为可检索、可复用的知识资产，缩短业务员的查询与响应时间。
      - idx: 能力 11
        title: 成交话术沉淀与最佳实践提炼
        body: 从历史成交的开发信与客户沟通中，提炼可复用的话术与打法，将个人经验沉淀为组织能力，支撑新业务员的快速成长。
  - id: deploy
    eyebrow: 05 · 部署
    title: 数据主权，由企业掌握
    grid: 2
    cards:
      - idx: 能力 12
        title: 本地部署 / 私有化
        body: 系统能力可部署于企业自有环境，客户与业务数据留存于本地、不出企业，满足数据安全与合规要求；亦支持完全私有化交付，由企业自主掌控运行环境、模型与运维。
    checks:
      - m: A
        title: 模块化架构
        body: 各能力模块相互解耦，可依据企业需求增减与组合。
      - m: B
        title: Agent 插件机制
        body: 新的行业逻辑与新的渠道，可以插件形式灵活扩展。
      - m: C
        title: 工作流可编排
        body: 获客链路的节点能够重组，以适配不同行业与业务打法。
      - m: D
        title: 客户自备模型
        body: 模型与算力由企业掌控，兼顾灵活性与可控性。
      - m: E
        title: 混合部署天然支持本地化
        body: 平台侧服务可下沉至企业机房，数据不出企业。
cta:
  title: 哪几项能力，最值得先落地？
  description: 把企业当前的行业属性、业务流程与合规要求讲清楚，我们给出可执行的落地顺序。
  primary:
    label: 预约方案沟通
    to: /contact
  secondary:
    label: 查看服务模式
    to: /services
