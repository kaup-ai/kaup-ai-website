pain:
  eyebrow: 现实
  title: 外贸获客的三重约束
  lede: 获客高度依赖业务员的经验与人力，而工具只能覆盖单点。三者相互叠加，构成企业扩张的天花板。
  cards:
    - icon: i-lucide-circle-dollar-sign
      title: 获客成本高
      body: 人力成本随团队规模线性增长——一个 5 人外贸团队，年度人力成本即达 30 万元量级；展会单次综合参展成本约 5 万元起，海关数据与平台会员费持续支出。
    - icon: i-lucide-users
      title: 人力依赖重
      body: 一名业务员能同时跟进的客户数量存在天然上限，而成熟的外贸业务员长期稀缺。企业若寻求规模化，几乎只能依赖扩充团队。
    - icon: i-lucide-puzzle
      title: 工具覆盖单点
      body: 传统工具只能提升单一环节效率，环节之间的衔接、判断与节奏把控仍靠人工完成，数据在流转中断层，信息损耗与效率损失随之而来。
compare:
  eyebrow: 形态
  title: 为什么是 AI Agent，而不是又一种工具
  lede: 根本差异在于「流程由谁驱动」。外贸获客不是孤立的任务，而是一条需要判断、多步骤衔接的业务链路。
  panels:
    - tag: 传统工具 / SaaS
      agent: false
      head: 人驱动工具，完成单点任务
      items:
        - 人负责找客户、写开发信、跟进客户
        - 工具仅提升单一环节的效率
        - 环节之间靠人工衔接，信息损耗
        - 数据留存于第三方，安全与合规受限
    - tag: AI Agent
      agent: true
      head: Agent 自主执行，人在关键节点把关
      items:
        - 端到端执行：识别 → 评估 → 触达 → 跟进 → 复盘
        - 重复、可标准化的环节由 Agent 承担
        - 人只在关键决策节点介入确认（HITL）
        - 支持本地部署，客户与业务数据不出企业
