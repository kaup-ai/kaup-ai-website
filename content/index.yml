    body: 我们用一次需求沟通，判断哪些环节值得先交给 Agent。
    link:
      label: 预约方案沟通
      to: /contact
modes:
  eyebrow: 服务与合作
  title: 两种交付模式，按企业的自主程度选择
  lede: 轻量起步选平台订阅，开箱即用；深度自主选定制 + 私有化，系统部署于企业自有环境。各模式的具体范围依据企业需求一对一确定。
  more:
    label: 查看服务详情
    to: /services
  cards:
    - tag: 模式一
      title: 平台订阅制
      body: 以订阅方式直接使用智御无疆平台的标准能力——智能拓客、三维评分、开发信自动化、多渠道触达等开箱即用。系统运行于平台，由平台持续迭代与运维，无需自建基础设施。
      fit: 适合：希望快速上线、以轻量投入先验证 AI 获客效果的企业。
    - tag: 模式二 · 完整组合
      title: 定制化 + 私有化
      body: 既依据企业需求定制 Agent 能力，又将定制后的系统完整部署于企业自有环境、与平台解耦——定制深度与完全自主可控同时达成。
      fit: 适合：既需贴合自身业务、又要求完全私有化的企业，例如具备强合规要求或自有技术团队者。
      featured: true
