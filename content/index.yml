# 首页文案（结构见 content.config.ts · index 集合）
seo:
  title: 智御无疆 Kaup — 赋能企业的 AI 全链路编排与智能调度平台
  ogTitle: 智御无疆 Kaup — 以 AI 助力企业超越能力和效率的边界
  description: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能。智御无疆 Kaup 面向中国 B2B 外贸企业提供 AI Agent 平台订阅、定制开发与本地部署：智能拓客、ICP 三维评分、开发信自动化、客户全生命周期管理等 12 项能力，数据不出企业。
  ogDescription: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能。把外贸获客的整条链路交给 AI Agent：识别 → 评估 → 触达 → 跟进 → 复盘。平台订阅 · 定制开发 · 本地部署 · 数据不出企业。
hero:
  note: 赋能企业的 AI 全链路编排与智能调度平台 · 定制开发 · 本地部署 / 私有化 · 数据不出企业
chain:
  eyebrow: 获客链路
  title: 五个环节，Agent 自主推进
  lede: 智御无疆是赋能企业的 AI 全链路编排与智能调度平台。我们把外贸获客的整条链路——识别、评估、触达、跟进、复盘——交给 AI Agent 自主执行，业务员只在关键决策节点把关。
  steps:
    - n: '01'
      name: 识别
      desc: 按品类与目标市场自主发现客户，去重并结构化
      icon: i-lucide-locate-fixed
    - n: '02'
      name: 评估
      desc: 匹配度 / 互动度 / 采购意向 三维动态评分
      icon: i-lucide-gauge
    - n: '03'
      name: 触达
      desc: 开发信序列自动发送，多渠道统一管理
      icon: i-lucide-send
      hitl: true
    - n: '04'
      name: 跟进
      desc: 复购提醒、流失预警与智能跟进节奏
      icon: i-lucide-bell-ring
    - n: '05'
      name: 复盘
      desc: 成交话术与最佳实践沉淀为组织能力
      icon: i-lucide-book-open
  note: 邮件发送、批量操作、数据删除等敏感动作强制执行人机确认（HITL），全流程留痕可审计。
