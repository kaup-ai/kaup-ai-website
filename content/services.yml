# 服务与合作页文案（结构见 content.config.ts · services 集合）
seo:
  title: 服务与合作 — 智御无疆 Kaup
  description: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能。智御无疆提供两种 AI Agent 交付模式：平台订阅制、定制化 + 私有化，合作流程为需求沟通 → 方案设计 → 定制开发 → 部署交付 → 运维支持。
head:
  eyebrow: 服务与合作
  title: "我们交付的不只是一个产品，\n而是一支能为你定制开发 AI Agent 的团队"
  claim: 以 AI 助力企业超越能力和效率的边界，重新定义无限可能
  lede: 以已建成的产品底座与模块化技术架构为基础：既可直接订阅平台标准能力快速起步，也可依据企业的行业属性、业务流程与合规要求定制开发、私有化部署——走哪条路，由企业的自主程度决定。
modes:
  eyebrow: 服务模式
  title: 两种交付模式，按企业的自主程度选择
  lede: 平台订阅制直接使用平台标准能力、开箱即用，系统由平台迭代与运维；定制化 + 私有化则依据企业需求深度定制，并将系统完整部署于企业自有环境、与平台解耦。核心区别在于两点：是否定制，以及系统运行在哪里。
  cards:
    - tag: 模式一
      title: 平台订阅制
      body: 以订阅方式直接使用智御无疆平台的标准能力——智能拓客、ICP 三维评分、开发信自动化、多渠道触达等 12 项能力开箱即用。系统运行于平台，由平台持续迭代与运维，企业按订阅获得全部更新。
      fit: 适合希望快速上线、以轻量投入先验证 AI 获客效果的外贸企业。
    - tag: 模式二 · 完整组合
      title: 定制化 + 私有化
      body: 既依据企业需求定制 Agent 能力，又将定制后的系统完整部署于企业自有环境、与平台解耦——定制深度与完全自主可控的完整组合。
      fit: 适合既需贴合自身业务、又要求完全私有化的企业，例如具备强合规要求或自有技术团队者。
      featured: true
modeTable:
  caption: 两种服务模式的差异
  head:
    - 模式
    - 是否脱离平台运行
    - 是否开展定制
  rows:
    - head: 模式一 · 平台订阅制
      cells:
        - 否，依托平台
        - 否，使用标准能力
    - head: 模式二 · 定制化 + 私有化
      cells:
        - 是，脱离平台
        - 是
  note: 各模式的具体范围与实施方案，依据企业需求一对一沟通后确定。
customization:
  eyebrow: 可定制性
  title: 可定制不是宣传说辞，而是架构设计的必然结果
  checks:
    - m: '01'
      title: 模块化架构
      body: 各能力模块相互解耦，可依据企业需求增减与组合。
    - m: '02'
      title: Agent 插件机制
      body: 新的行业逻辑与新的渠道，可以插件形式灵活扩展。
    - m: '03'
      title: 工作流可编排
      body: 获客链路的节点能够重组，以适配不同行业与业务打法。
    - m: '04'
      title: 客户自备模型
      body: 模型与算力由企业掌控，兼顾灵活性与可控性。
    - m: '05'
      title: 混合部署天然支持本地化
      body: 平台侧服务可下沉至企业机房，数据不出企业。
delivery:
  eyebrow: 交付
  title: 合作流程与交付内容
  lede: 项目周期因需求范围而异（不同复杂度差异较大），不设统一周期；系统上线后提供持续的运维与迭代支持。
  steps:
    - n: '01'
      title: 需求沟通
      desc: 明确行业属性与合规要求
    - n: '02'
      title: 方案设计
      desc: 确定定制范围与交付边界
    - n: '03'
      title: 定制开发
      desc: 按需组合、裁剪与扩展
    - n: '04'
      title: 部署交付
      desc: 私有化部署与环境交付
    - n: '05'
      title: 运维支持
      desc: 持续运维与迭代支持。
  cards:
    - title: 系统与 Agent
      body: 订阅模式开通平台账号与权限配置；定制模式交付按需组合、裁剪与扩展的能力模块，以及与既有系统对接的部分。
    - title: 部署环境
      body: 订阅模式由平台托管运行；定制 + 私有化模式部署于企业自有环境的本地运行环境。
    - title: 使用文档
      body: 面向管理员与业务员的操作与配置文档。
    - title: 团队培训
      body: 面向实施与业务团队的上手培训，支撑能力真正落地。
cta:
  title: 把需求讲清楚，剩下的交给我们
  description: 如需进一步沟通定制开发或本地部署事宜，欢迎联系智御无疆团队。
  primary:
    label: 预约方案沟通
    to: /contact
