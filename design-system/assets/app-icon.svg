<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Kaup app icon (curved chevron in white on fjord blue)">
  <title>Kaup — Curved Chevron (white on fjord blue, 15° tilt) + amber dot</title>

  <!-- Fjord deep-blue background -->
  <rect width="1024" height="1024" fill="#0E2A47"/>

  <!-- Mark: curved chevron, pure white, scaled 6x, centered (80% safe zone), tilted -15° -->
  <g transform="translate(212 212) scale(6) rotate(-15 50 50)">
    <path d="M 15 15 C 25 20, 55 35, 80 50 C 55 65, 25 80, 15 85 L 40 85 C 50 78, 75 65, 85 50 C 75 35, 50 22, 40 15 Z" fill="#F7F9FC"/>
    <!-- Amber north-star dot — r=5 (was r=3.5, too small at icon scales). Brand promise: always #E89B3C. -->
    <circle cx="76" cy="50" r="5" fill="#E89B3C"/>
  </g>
</svg>
